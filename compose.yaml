services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apphealth
      POSTGRES_PASSWORD: apphealth
      POSTGRES_DB: apphealth
    ports:
      - "5432:5432"
    volumes:
      - apphealth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apphealth -d apphealth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apphealth_postgres_data:
